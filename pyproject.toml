[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wq-local-engine"
version = "1.1.0"
description = "Ultra-Fast (<20ms) Offline WorldQuant BRAIN Backtest and Alpha Screening Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "YinXiang-Impressionist", email = "easonyin2008@gmail.com" }
]
dependencies = [
    "polars>=1.0.0",
    "numpy>=1.22.0",
    "rich>=12.0.0",
    "yfinance>=0.2.0",
]

[project.scripts]
wq-backtest = "cli:main"

[tool.setuptools]
packages = ["data_loader", "engine"]
py-modules = ["cli", "gui"]
